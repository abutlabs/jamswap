[package]
name = "match-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Jamswap frequent-batch-auction uniform-price matching engine (no_std, integer-only, deterministic)"

[dependencies]
ed25519-compact = { version = "2", default-features = false }
# round ids (round_id.rs); the same crate, version and features the service already links
blake2 = { version = "0.10", default-features = false }

[dev-dependencies]
# property testing for the clearing invariants
proptest = "1"
