# Jamswap on an ALL-LASAIR JAM chain — six lasair validators, one coherent
# consensus. This is the RELIABILITY configuration: unlike the mixed lasair+
# PolkaJam net (docker-compose.mixed.yml), every validator runs the same client,
# so they share ONE fork choice (GP best-chain: ticketed-ancestor score, then
# height, then first-seen) AND GRANDPA β-finalization (jam-np PR #6 draft wire
# protocol by default; a 2/3+1 super-majority finalizes, and Block_tree pins β
# so no head re-orgs below it).
#
# Why this exists: on the mixed net a settlement only lands if a lasair node
# authors within U=5 slots AND its block stays canonical — but lasair and
# PolkaJam ran different fork-choice/finality regimes, so lasair's settlement
# blocks routinely lost canonicity and cum_volume pinned at 0 (measured
# 2026-07-09: 138 guarantees, 0 durable clears). On this all-lasair net the six
# validators finalize in lockstep, so a settled block can never be re-orged
# away: SETTLE_HOLD_SECS=0 (finality replaces the hold timer) and trades settle
# durably with zero reverts — validated live (finalized head advancing across
# all six nodes, zero forks/rollbacks/reverts under sustained DEX load, P5).
# Cross-client finality with PolkaJam is demonstrated separately by the
# spec-based bridge (docker-compose.pj-majority.yml).
#
#   docker compose -f docker-compose.lasair6.yml up -d --build
#   docker compose -f docker-compose.lasair6.yml logs -f lm0 | grep -E "STATUS|accumulated"
#
# All six validators are STANDARD JAM dev accounts (index -> seed u32-LE x8), the
# same keys the loadgen/UI wallets sign with. spec-init mints the shared genesis
# (LAYOUT all-lasair) and writes /shared/genesis_hex + peers_<i>.txt.

x-mesh: &mesh
  image: ${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.1.2}
  restart: unless-stopped
  # validator INDEX runs as dev account INDEX holding only its own key (DEV_VALIDATOR,
  # lasair#54), or, with LASAIR_DEV_ALL_KEYS=1, in lasair's devnet mode (OWN, default
  # INDEX: it derives every dev secret). lasair's mesh-entrypoint.sh makes the flags.
  entrypoint:
    - bash
    - -c
    - |
      if [ "$${LASAIR_DEV_ALL_KEYS:-0}" = 1 ]; then export OWN="$${OWN:-$$INDEX}"
      else unset OWN; export DEV_VALIDATOR="$$INDEX"; fi
      exec /usr/local/bin/mesh-entrypoint.sh
  volumes:
    - "shared:/shared"
    - "./service/jamswap-service.jam:/work/jamswap-service.jam:ro"
  networks: { lasnet: {} }

# every validator is a guarantor holding only its own key: it co-guarantees with the
# core's other validators over CE-134/135 (lasair#60) and assures as itself. The switch
# LASAIR_DEV_ALL_KEYS=1 (docs/NETS.md, "Keys per client") restores the devnet mode, in
# which each node derives all six secrets and signs guarantees as any GUARANTOR_OWN index.
x-mesh-env: &mesh-env
  SPEC: /shared/spec.json
  SERVICE: /work/jamswap-service.jam
  SERVICE_ID: "100"
  GUARANTOR_OWN: "0,1,2,3,4,5"          # devnet mode only (LASAIR_DEV_ALL_KEYS=1)
  LASAIR_DEV_ALL_KEYS: "${LASAIR_DEV_ALL_KEYS:-0}"
  # LASAIR_DATA_DIR=/data: durable storage (lasair >= 2.1.1; blocks below finality leave
  # memory, lasair#57/#49). Unset: memory only
  DATA_DIR: "${LASAIR_DATA_DIR:-}"
  # one slot every 6 s, JAM's slot time. A work-package's context is set when the builder
  # submits it (lasair#69): its anchor must still be one of the last 8 blocks, and its
  # lookup anchor within 24 slots, when the guarantee is reported. At 1 s a slot that
  # window is 8 s, shorter than refining a 48-order round (15-100 s on a laptop), so the
  # large rounds expired unreported and settlement stalled (2026-09-28, lasair 2.1.0).
  INTERVAL: "6"
  # CHAIN-PACED, not wall-clock. --wall (WALL=1) exists to co-pace with PolkaJam on the
  # MIXED net; here there is no PolkaJam. The shared genesis is minted at slot 0, but the
  # real JAM wall slot is ~8.05M, so every wall-paced validator saw head(0) lagging wall by
  # 8M slots, declared itself out of sync, and back-filled forever instead of authoring —
  # the chain never left genesis and nothing settled. Chain-paced authoring free-runs from
  # genesis slot 0 (author head+1 every INTERVAL), so a fresh all-lasair net advances at once.
  WALL: "0"
  # Finality gadget: "grandpa" (default) = the jam-np PR #6 draft-spec multi-round
  # gadget — chaos-hardened 2026-07-16 (restart rejoin, kill-2 stall w/o rollback,
  # quorum-return resume; see lasair/docs/GRANDPA_GAPS.md for the spec-gap register).
  # "ce192" = the earlier lasair-native single-round gadget, kept as fallback.
  LASAIR_FINALITY: "${LASAIR_FINALITY:-grandpa}"

services:
  # mint the all-lasair shared genesis (runs once, then exits 0). Reuses the mixed
  # image only because it carries nets/genesis.py + the lasair binary; no PolkaJam runs.
  # Built here too, from the SAME lasair image the validators run (its lasair binary
  # writes the service into genesis), so a fresh clone needs nothing prebuilt.
  spec-init:
    build:
      context: .
      dockerfile: mixed/Dockerfile.polkajam
      args:
        MESH_IMAGE: ${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.1.2}
        PJ_RELEASE: ${PJ_RELEASE:-nightly-2026-09-22}
    image: jamswap-pj-mixed:local
    restart: "no"
    environment:
      ROLE: init
      SHARED: /shared
      LAYOUT: lasair,lasair,lasair,lasair,lasair,lasair
      IP_BASE: "172.29.0"          # peers_<i>.txt must carry THIS net's IPs (matches lasnet subnet)
      IP_START: "10"               # index i -> 172.29.0.(10+i), same as the service ipv4_address pins
      SERVICE: /work/jamswap-service.jam
      SERVICE_ID: "100"
    volumes:
      - "shared:/shared"
      - "./service/jamswap-service.jam:/work/jamswap-service.jam:ro"
    networks: { lasnet: {} }

  lm0:
    <<: *mesh
    depends_on: { spec-init: { condition: service_completed_successfully } }
    environment: { <<: *mesh-env, INDEX: "0", IDENTITY: "100", PORT: "40060" }
    networks: { lasnet: { ipv4_address: 172.29.0.10 } }
  lm1:
    <<: *mesh
    depends_on: { spec-init: { condition: service_completed_successfully } }
    environment: { <<: *mesh-env, INDEX: "1", IDENTITY: "101", PORT: "40061" }
    networks: { lasnet: { ipv4_address: 172.29.0.11 } }
  lm2:
    <<: *mesh
    depends_on: { spec-init: { condition: service_completed_successfully } }
    environment: { <<: *mesh-env, INDEX: "2", IDENTITY: "102", PORT: "40062" }
    networks: { lasnet: { ipv4_address: 172.29.0.12 } }
  lm3:
    <<: *mesh
    depends_on: { spec-init: { condition: service_completed_successfully } }
    environment: { <<: *mesh-env, INDEX: "3", IDENTITY: "103", PORT: "40063" }
    networks: { lasnet: { ipv4_address: 172.29.0.13 } }
  lm4:
    <<: *mesh
    depends_on: { spec-init: { condition: service_completed_successfully } }
    environment: { <<: *mesh-env, INDEX: "4", IDENTITY: "104", PORT: "40064" }
    networks: { lasnet: { ipv4_address: 172.29.0.14 } }
  lm5:
    <<: *mesh
    depends_on: { spec-init: { condition: service_completed_successfully } }
    environment: { <<: *mesh-env, INDEX: "5", IDENTITY: "105", PORT: "40065" }
    networks: { lasnet: { ipv4_address: 172.29.0.15 } }

  # CE-133 submit bridge of the dex's jamnp backend (LASAIR_DEX_BACKEND=jamnp, for a
  # lasair image whose reader serves no JIP-2), and of the differential harness
  # (docs/DIFFERENTIAL_TESTNET.md). Each work-item goes to ONE validator's builder endpoint
  # (blake2b(payload) mod 6; each node's builder ALPN port = its PORT+1), failing over
  # around the ring on a CE-133 error. Fanning every item to all six made up to six
  # copies accumulate (a deposit was credited 3×; the service now credits each deposit
  # nonce once and refuses a copied carry-commit, jamswap#7/#5).
  # LASAIR_BUILDER_FANOUT=all restores the fan-out.
  builder:
    image: ${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.1.2}
    depends_on: { spec-init: { condition: service_completed_successfully } }
    volumes: [ "shared:/shared" ]
    entrypoint: ["bash", "-c"]
    command:
      - |
        for _ in $$(seq 1 60); do [ -s /shared/genesis_hex ] && break; sleep 1; done
        export LASAIR_JAMNP_GENESIS_HEX=$$(cat /shared/genesis_hex)
        exec /usr/local/bin/jamnp-builder
    environment:
      LASAIR_GUARANTOR_HOST: 172.29.0.10,172.29.0.11,172.29.0.12,172.29.0.13,172.29.0.14,172.29.0.15
      LASAIR_GUARANTOR_PORT: "40061,40062,40063,40064,40065,40066"
      LASAIR_BUILDER_HTTP_PORT: "19980"
      LASAIR_BUILDER_FANOUT: ${LASAIR_BUILDER_FANOUT:-}   # "all" = every item to all six (duplication test)
    networks: { lasnet: {} }
    restart: unless-stopped

  # lasair-reader, one per node: HTTP /read (CE-129, proven against the block's state
  # root) and, on the same port, the JIP-2 node RPC over a WebSocket (lasair#68), whose
  # submitWorkPackage goes to the first of LASAIR_RPC_GUARANTORS (every node's builder
  # endpoint, PORT+1) that takes it. `reader` follows lm0 and is the dex's node;
  # reader1..reader5 follow lm1..lm5, so netwatch reads every node by hash (./dex soak:
  # one head, finality, state parity).
  reader: &reader
    image: ${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.1.2}
    depends_on: { spec-init: { condition: service_completed_successfully } }
    volumes: [ "shared:/shared" ]
    entrypoint: ["bash", "-c"]
    command:
      - |
        for _ in $$(seq 1 60); do [ -s /shared/genesis_hex ] && break; sleep 1; done
        export LASAIR_JAMNP_GENESIS_HEX=$$(cat /shared/genesis_hex)
        exec /usr/local/bin/lasair-reader
    environment: &reader-env
      LASAIR_NODE_HOST: 172.29.0.10
      LASAIR_NODE_PORT: "40060"
      LASAIR_CHAIN_SPEC: /shared/spec.json
      LASAIR_READER_HTTP_PORT: "19990"
      LASAIR_RPC_GUARANTORS: "172.29.0.10:40061,172.29.0.11:40062,172.29.0.12:40063,172.29.0.13:40064,172.29.0.14:40065,172.29.0.15:40066"
    networks: { lasnet: {} }
    restart: unless-stopped
  reader1:
    <<: *reader
    environment: { <<: *reader-env, LASAIR_NODE_HOST: 172.29.0.11, LASAIR_NODE_PORT: "40061" }
  reader2:
    <<: *reader
    environment: { <<: *reader-env, LASAIR_NODE_HOST: 172.29.0.12, LASAIR_NODE_PORT: "40062" }
  reader3:
    <<: *reader
    environment: { <<: *reader-env, LASAIR_NODE_HOST: 172.29.0.13, LASAIR_NODE_PORT: "40063" }
  reader4:
    <<: *reader
    environment: { <<: *reader-env, LASAIR_NODE_HOST: 172.29.0.14, LASAIR_NODE_PORT: "40064" }
  reader5:
    <<: *reader
    environment: { <<: *reader-env, LASAIR_NODE_HOST: 172.29.0.15, LASAIR_NODE_PORT: "40065" }

  # netwatch (offchain/netwatch.py): every node over its reader's JIP-2, one head,
  # finality and state parity by hash (A1-A3); `./dex soak` drives it. /metrics and
  # /verdict on 127.0.0.1:9300.
  netwatch:
    build: { context: ., dockerfile: monitor/Dockerfile }
    depends_on: [reader, reader1, reader2, reader3, reader4, reader5]
    environment:
      NETWATCH_NODES: >-
        lm0,lasair,ws://reader:19990 lm1,lasair,ws://reader1:19990
        lm2,lasair,ws://reader2:19990 lm3,lasair,ws://reader3:19990
        lm4,lasair,ws://reader4:19990 lm5,lasair,ws://reader5:19990
      NETWATCH_VALIDATORS: lm0,lm1,lm2,lm3,lm4,lm5
    ports: ["127.0.0.1:9300:9106"]
    networks: { lasnet: {} }
    restart: unless-stopped

  dex:
    build:
      context: .
      dockerfile: offchain/Dockerfile
    depends_on: [reader]
    environment:
      # the DEX on lm0's JIP-2, served by its lasair-reader (lasair#68): heads, finality
      # and state read at the finalized block (lasair#70), work-packages submitted to
      # lasair's guarantors (CE-133). The service stays seeded into genesis at 100: a
      # lasair guarantor refines only the service it hosts.
      CHAIN_BACKEND: ${LASAIR_DEX_BACKEND:-jip2}
      CHAIN_RPC: ws://reader:19990
      CHAIN_SPEC: /shared/spec.json   # the authorizer in the cores' pools
      SERVICE_ID: "100"
      # the footprint is readable over JIP-2, so JAMKB backpressure is live: keep the
      # reserve topped up (server.py, reserve keeper)
      RESERVE_TOPUP: "1"
      # LASAIR_DEX_BACKEND=jamnp (a lasair image older than 2.1.0): the builder and reader
      # bridges over HTTP, heads and finality from lm0's Prometheus gauges
      BUILDER_URL: http://builder:19980
      READER_URL: http://reader:19990
      NODE_METRICS_URL: http://lm0:9615/metrics
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
      ORDER_EVENTS_FILE: /shared/order_events.jsonl
      # the net FINALIZES (GRANDPA, the jam-np PR #6 draft: LASAIR_FINALITY above;
      # see lasair docs/FINALITY_PLAN.md): history below the finalized head cannot
      # re-org, so settlement durability comes from CONSENSUS, not a hold
      # timer. jamswap_settle_reverted_total still watches — a revert now means
      # a finality violation, i.e. a chain bug by definition.
      SETTLE_HOLD_SECS: "0"
      # only rounds the chain never included wait this long: a round that CAN'T settle any
      # more (book moved / floor passed / commit gone) is released in seconds, and one that
      # settles after release is still finalized from its landed-round marker. At 60 s healthy
      # rounds cut it close (57-58 s seen in the 2026-09-24 soak; refine alone is 15-60 s).
      ROUND_GATE_SECS: "180"
      MAX_ROUND_ORDERS: "48"       # small rounds settle fast; a giant round wedges the market gate
    volumes:
      - "./offchain:/app:ro"
      - "./service/jamswap-service.jam:/work/jamswap-service.jam:ro"
      - "shared:/shared"
    working_dir: /app
    command: ["python3", "server.py"]
    ports: ["8081:8080"]
    networks: { lasnet: {} }
    restart: unless-stopped

  # offered load: crossing buy/sell pairs from the six dev accounts, so the SLO's
  # marketable denominator is continuously fed. RATE orders/min; some sealed.
  loadgen:
    build:
      context: .
      dockerfile: offchain/Dockerfile
    depends_on: [dex]
    command: ["python3", "loadgen.py"]
    environment:
      DEX_URL: http://dex:8080
      PROFILE: ${PROFILE:-trading}
      RATE: ${RATE:-12}
      SEALED_RATIO: ${SEALED_RATIO:-0.2}
      PYTHONUNBUFFERED: "1"
    volumes:
      - "./offchain:/app:ro"
    networks: { lasnet: {} }
    restart: unless-stopped

networks:
  lasnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  shared:
    name: jamswap_lasair6_shared
