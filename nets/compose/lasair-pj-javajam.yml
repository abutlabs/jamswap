      LASAIR_FINALITY: "${LASAIR_FINALITY:-grandpa}"
      GUARANTOR_OWN: "${LASAIR_GUARANTOR_OWN-0,1}"
      LASAIR_DEV_ALL_KEYS: "${LASAIR_DEV_ALL_KEYS:-1}"
      SERVICE: "/work/jamswap-service.jam"
      SERVICE_ID: "100"
    volumes:
      - "shared:/shared"
      - "../../service/jamswap-service.jam:/work/jamswap-service.jam:ro"
    ports:
      - "${HOST_IP:-127.0.0.1}:41600:41600/udp"
  lm1:
