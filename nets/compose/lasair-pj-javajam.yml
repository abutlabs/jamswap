# GENERATED by nets/netgen.py from profile 'lasair-pj-javajam' (#20) - do not edit.
# Change nets/profiles.py or nets/netgen.py, then `./dex gen`.
#
# 2 lasair : 2 PolkaJam : 2 JavaJAM + the DEX.
#
#   ./dex up NET=lasair-pj-javajam        start it (JavaJAM runs natively on macOS)
#   ./dex heads NET=lasair-pj-javajam     one head + finality across every node's RPC
#   ./dex down NET=lasair-pj-javajam      tear down, wipe the chain
#
#   i  client    service  JAMNP-S udp  RPC (host 127.0.0.1)
#   0  lasair    lm0      41600        -  (logs)
#   1  lasair    lm1      41601        -  (logs)
#   2  polkajam  pj2      41602        42602
#   3  polkajam  pj3      41603        42603
#   4  javajam   jj4      41604        42604  (native on macOS)
#   5  javajam   jj5      41605        42605  (native on macOS)
#
# Keys: validator i is standard dev account i and only its own node signs as it,
# EXCEPT lasair (LASAIR_DEV_ALL_KEYS=1 by default until lasair#62): every lasair
# node signs guarantees as any lasair index and, with lasair <= 2.x, assures for
# every dev account. LASAIR_DEV_ALL_KEYS=0 narrows guarantees to its own index.

services:
  spec-init:
    build:
      context: "../.."
      dockerfile: "mixed/Dockerfile.polkajam"
      target: "with-lasair"
      args:
        PJ_RELEASE: "${PJ_RELEASE:-nightly-2026-09-22}"
        MESH_IMAGE: "${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.0.0}"
    image: "jamswap-polkajam:${PJ_RELEASE:-nightly-2026-09-22}-lasair"
    restart: "no"
    volumes:
      - "shared:/shared"
      - "../../service/jamswap-service.jam:/work/jamswap-service.jam:ro"
    networks:
      net: {}
    environment:
      ROLE: "init"
      SHARED: "/shared"
      CLIENTS: "lasair,lasair,pj,pj,javajam,javajam"
      IP_BASE: "10.231.6"
      IP_START: "10"
      BASE_PORT: "41600"
      RPC_BASE: "42600"
      HOST_IP: "${HOST_IP:-}"
      SERVICE: "/work/jamswap-service.jam"
      SERVICE_ID: "100"
  lm0:
