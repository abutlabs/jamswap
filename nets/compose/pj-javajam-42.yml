# Change nets/profiles.py or nets/netgen.py, then `./dex gen`.
#
# 4 PolkaJam : 2 JavaJAM, both GRANDPA + the DEX on JIP-2.
#
#   ./dex up NET=pj-javajam-42        start it (JavaJAM runs natively on macOS)
#   ./dex heads NET=pj-javajam-42     one head + finality across every node's RPC
#   ./dex down NET=pj-javajam-42      tear down, wipe the chain
#   ./dex load NET=pj-javajam-42      start the load generator (up leaves it stopped)
#   ./dex soak NET=pj-javajam-42 600  A1-A4: load + netwatch, then parity + soak verdict
#
# DEX http://localhost:8205 (CHAIN_BACKEND=jip2, no SERVICE_ID) on the JIP-2 RPC of `rpc`,
# an ordinary PolkaJam node (udp 41550, RPC 127.0.0.1:42550): at startup it deploys
# the service through the Bootstrap service, lists the markets and funds the
# dev accounts. netwatch over every validator: 127.0.0.1:9305 (/metrics, /verdict).
# Work-packages go through rpc and jj4 in turn (CHAIN_SUBMIT_RPC): jj4's validator RPC
# takes them itself, where a PolkaJam validator's does not.
#
#   i  client    service  JAMNP-S udp  RPC (host 127.0.0.1)
#   0  polkajam  pj0      41500        42500
#   1  polkajam  pj1      41501        42501
#   2  polkajam  pj2      41502        42502
#   3  polkajam  pj3      41503        42503
#   4  javajam   jj4      41504        42504  (native on macOS)
#   5  javajam   jj5      41505        42505  (native on macOS)
#
# Keys: validator i is standard dev account i and only its own node signs as it,
# with no exception: no lasair node, no shared keys.

