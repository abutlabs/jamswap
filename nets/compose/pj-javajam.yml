# GENERATED by nets/netgen.py from profile 'pj-javajam' (#18) - do not edit.
# Change nets/profiles.py or nets/netgen.py, then `./dex gen`.
#
# 3 PolkaJam : 3 JavaJAM, both GRANDPA + the DEX on JIP-2.
#
#   ./dex up NET=pj-javajam        start it (JavaJAM runs natively on macOS)
#   ./dex heads NET=pj-javajam     one head + finality across every node's RPC
#   ./dex down NET=pj-javajam      tear down, wipe the chain
#   ./dex load NET=pj-javajam      start the load generator (up leaves it stopped)
#   ./dex soak NET=pj-javajam 600  A1-A4: load + netwatch, then parity + soak verdict
#
# DEX http://localhost:8204 (CHAIN_BACKEND=jip2, no SERVICE_ID) on the JIP-2 RPC of `rpc`,
# an ordinary PolkaJam node (udp 41450, RPC 127.0.0.1:42450): at startup it deploys
# the service through the Bootstrap service, lists the markets and funds the
# dev accounts. netwatch over every validator: 127.0.0.1:9304 (/metrics, /verdict).
# Work-packages go through rpc and jj3 in turn (CHAIN_SUBMIT_RPC): jj3's validator RPC
# takes them itself, where a PolkaJam validator's does not.
#
#   i  client    service  JAMNP-S udp  RPC (host 127.0.0.1)
#   0  polkajam  pj0      41400        42400
#   1  polkajam  pj1      41401        42401
#   2  polkajam  pj2      41402        42402
#   3  javajam   jj3      41403        42403  (native on macOS)
#   4  javajam   jj4      41404        42404  (native on macOS)
#   5  javajam   jj5      41405        42405  (native on macOS)
#
# Keys: validator i is standard dev account i and only its own node signs as it,
# with no exception: no lasair node, no shared keys.

