#
# DEX http://localhost:8201 (CHAIN_BACKEND=jip2, no SERVICE_ID) on the JIP-2 RPC of `rpc`,
# an ordinary PolkaJam node (udp 41150, RPC 127.0.0.1:42150): at startup it deploys
# the service through the Bootstrap service, lists the markets and funds the
