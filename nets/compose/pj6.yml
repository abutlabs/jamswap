# 6x PolkaJam, GRANDPA + the DEX on JIP-2: no lasair node at all.
#
#   ./dex up NET=pj6        start it
#   ./dex heads NET=pj6     one head + finality across every node's RPC
#   ./dex down NET=pj6      tear down, wipe the chain
#   ./dex load NET=pj6      start the load generator (up leaves it stopped)
