# GENERATED by nets/netgen.py from profile 'lasair-pj' (#20) - do not edit.
# Change nets/profiles.py or nets/netgen.py, then `./dex gen`.
#
# 3 lasair : 3 PolkaJam, GRANDPA, one key each + the DEX (lasair guarantees).
#
#   ./dex up NET=lasair-pj        start it
#   ./dex heads NET=lasair-pj     one head + finality across every node's RPC
#   ./dex down NET=lasair-pj      tear down, wipe the chain
#   ./dex load NET=lasair-pj      start the load generator (up leaves it stopped)
#   ./dex soak NET=lasair-pj 600  A1-A4: load + netwatch, then parity + soak verdict
#
# DEX http://localhost:8206 (CHAIN_BACKEND=jip2, SERVICE_ID 100 in genesis) on the JIP-2 of
# `reader`, the first lasair node's lasair-reader, which hands each work-package
# to a lasair guarantor (CE-133). Every lasair node has a reader; netwatch reads
# each node through it or its own RPC: 127.0.0.1:9306 (/metrics, /verdict).
# LASAIR_DEX_BACKEND=jamnp: the dex on lasair's HTTP bridges (`builder`, `reader`).
#
#   i  client    service  JAMNP-S udp  RPC (host 127.0.0.1)
#   0  lasair    lm0      41600        -  (logs)
#   1  lasair    lm1      41601        -  (logs)
#   2  lasair    lm2      41602        -  (logs)
#   3  polkajam  pj3      41603        42603
#   4  polkajam  pj4      41604        42604
#   5  polkajam  pj5      41605        42605
#
# Keys: validator i is standard dev account i and only its own node signs as it.
# lasair runs DEV_VALIDATOR=i; LASAIR_DEV_ALL_KEYS=1 switches its nodes to lasair's
# devnet mode (OWN=i: every dev secret, guarantees as any lasair index).

services:
  spec-init:
    build:
      context: "../.."
      dockerfile: "mixed/Dockerfile.polkajam"
      target: "with-lasair"
      args:
        PJ_RELEASE: "${PJ_RELEASE:-nightly-2026-09-22}"
        MESH_IMAGE: "${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.1.1}"
    image: "jamswap-polkajam:${PJ_RELEASE:-nightly-2026-09-22}-lasair"
    restart: "no"
    volumes:
      - "shared:/shared"
      - "../../service/jamswap-service.jam:/work/jamswap-service.jam:ro"
    networks:
      net: {}
    environment:
      ROLE: "init"
      SHARED: "/shared"
      CLIENTS: "lasair,lasair,lasair,pj,pj,pj"
      IP_BASE: "10.231.6"
      IP_START: "10"
      BASE_PORT: "41600"
      RPC_BASE: "42600"
      HOST_IP: "${HOST_IP:-}"
      SERVICE: "/work/jamswap-service.jam"
      SERVICE_ID: "100"
  lm0:
    image: "${LASAIR_IMAGE:-ghcr.io/abutlabs/lasair:2.1.1}"
    entrypoint:
      - "bash"
      - "-c"
      - |
        if [ "$${LASAIR_DEV_ALL_KEYS:-0}" = 1 ]; then export OWN="$${OWN:-$$INDEX}"
        else unset OWN; export DEV_VALIDATOR="$$INDEX"; fi
        exec /usr/local/bin/mesh-entrypoint.sh
    depends_on:
      spec-init:
        condition: "service_completed_successfully"
    networks:
      net:
        ipv4_address: "10.231.6.10"
    restart: "unless-stopped"
    environment:
      SPEC: "/shared/spec.json"
      INDEX: "0"
      IDENTITY: "100"
      PORT: "41600"
      WALL: "1"
      INTERVAL: "1"
      LASAIR_FINALITY: "${LASAIR_FINALITY:-grandpa}"
      LASAIR_DEV_ALL_KEYS: "${LASAIR_DEV_ALL_KEYS:-0}"
      DATA_DIR: "${LASAIR_DATA_DIR:-}"
      GUARANTOR_OWN: "0,1,2"
      SERVICE: "/work/jamswap-service.jam"
      SERVICE_ID: "100"
    volumes:
