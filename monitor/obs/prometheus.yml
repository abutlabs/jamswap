# obs Prometheus: one scrape job over every registered target (monitor/obs/obs register).
#
# Each file in /etc/prometheus/targets is one net's job, written by `obs register`: its
# targets carry net, run_id, job, node, client (and __metrics_path__ when not /metrics),
# so every series is labelled with the run it belongs to.
#
# honor_labels: a series' own node/client labels win over the target's. netwatch
# exports one series per node it watches ({node="pj3", client="polkajam"}); those keep
# the watched node's name, and netwatch's net-wide series get node="netwatch".
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: obs
    honor_labels: true
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        # file events do not always cross a bind mount on Docker Desktop: re-read anyway
        refresh_interval: 5s
