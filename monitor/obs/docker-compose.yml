# obs: the always-on Prometheus + Grafana every lasair and jamswap run reports into.
# Its own compose project, independent of any net. Drive it with the CLI next to this
# file, which sets OBS_STATE (the file_sd target directory) before calling compose:
#
#   monitor/obs/obs up        # Grafana http://localhost:3300, Prometheus http://localhost:9390
#   monitor/obs/obs down      # stops it; the data volumes are kept
#
# Targets are not listed here: `obs register` writes one file_sd JSON per net and job
# into $OBS_STATE/targets, and connects the Prometheus container to a Docker net's
# network so it scrapes containers by name (lm0:9615, dex:8080, ...). Host-native nodes
# are scraped at host.docker.internal:<port>. See monitor/README.md.

name: obs

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: obs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${OBS_RETENTION_TIME:-30d}
      # a cap so a month of soaks cannot fill the disk; the oldest blocks go first
      - --storage.tsdb.retention.size=${OBS_RETENTION_SIZE:-5GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBS_STATE:?run through monitor/obs/obs, which sets OBS_STATE}/targets:/etc/prometheus/targets:ro
      - prometheus:/prometheus
    extra_hosts:
      # native nodes on this machine (Linux needs the mapping; Docker Desktop has it)
      - host.docker.internal:host-gateway
    ports:
      - ${OBS_BIND:-127.0.0.1}:${OBS_PROMETHEUS_PORT:-9390}:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: obs-grafana
    environment:
      # anyone who can reach the port may look; only admin (the CLI) writes
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      # applied when the Grafana volume is first created; set it before the first `obs up`
      GF_SECURITY_ADMIN_PASSWORD: ${OBS_GRAFANA_PASSWORD:-obs}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/obs-chain.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    ports:
      - ${OBS_BIND:-127.0.0.1}:${OBS_GRAFANA_PORT:-3300}:3000
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus: {}
  grafana: {}
